<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - RETU</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/new_styles.css}" />
</head>

<body>
    <!---ASIDE NUEVO Responsive-->
    <!-- Mobile Menu Toggle -->
    <div class="menu-toggle" id="mobileMenuToggle">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- Sidebar Menu   -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>RETU</h2>
        </div>
        <ul class="sidebar-menu">
            <li><a th:href="@{/home}" class="active"><i class="fas fa-home-alt"></i> Inicio</a></li>
            <li><a th:href="@{/tareas}"><i class="fas fa-pencil"></i> Tareas</a></li>
            <li><a th:href="@{/tutores}"><i class="fas fa-users"></i> Tutores</a></li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">

        <header class="retu-superior">
            <div class="contenedor-cabecera">
                <h1 class="titulo-principal">Dashboard</h1>

                <div class="perfil-usuario">
                    <div class="info-personal">
                        <img src="/imagenes/perfil.png" alt="Foto del Tutor" class="foto-tutor">
                        <span class="nombre-usuario" id="nombre-tutor">Nombre Tutor</span>
                    </div>

                    <!-- 🔒 Formulario de cierre de sesión -->
                    <form th:action="@{/logout}" method="post" id="logoutForm" style="display: none;"></form>

                    <button class="boton-salir" onclick="document.getElementById('logoutForm').submit();">
                        <img src="/imagenes/cerrar-sesion.png" alt="Cerrar sesión" class="icono-salir">
                    </button>
                </div>
            </div>
        </header>

        <div class="container">
            <!-- Sección de Tutores -->
            <div class="section-title">
                <h2>Lista de Tutores</h2>
            </div>

            <div class="table-container">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Materia</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="t, stat : ${tutores}">
                            <td th:text="${t.nombre}">nombre</td>
                            <td th:text="${t.correo}">correo</td>
                            <td th:text="${t.materia}">materia</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Sección de Tareas -->
            <div class="section-title" style="margin-top: 40px;">
                <h2>Lista de Tareas</h2>
            </div>

            <div class="table-container">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Título</th>
                            <th>Descripción</th>
                            <th>Fecha de Entrega</th>
                            <th>Categoría</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="task, stat : ${tareas}">
                            <td th:text="${task.titulo}">titulo</td>
                            <td th:text="${task.descripcion}">descripcion</td>
                            <td th:text="${task.fechaEntrega}">fecha</td>
                            <td th:text="${task.categoria}">categoria</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
