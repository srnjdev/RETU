# Puerto de la aplicación
server.port=8080

# Configuración de la base de datos usando variables de entorno con valores por defecto
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-polished-bread-a81ds6pa-pooler.eastus2.azure.neon.tech:5432/neondb?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_zIc9rGt5fVda}

# Crea o actualiza las tablas en desarrollo
spring.jpa.hibernate.ddl-auto=update

# Mostrar las consultas SQL en la consola
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ====================
# 🔽 CONFIGURACIÓN DE AUTH0
# ====================
spring.security.oauth2.client.registration.auth0.client-id=${AUTH0_CLIENT_ID}
spring.security.oauth2.client.registration.auth0.client-secret=${AUTH0_CLIENT_SECRET}
spring.security.oauth2.client.registration.auth0.scope=${AUTH0_SCOPE}
spring.security.oauth2.client.registration.auth0.redirect-uri=${AUTH0_REDIRECT_URI}
spring.security.oauth2.client.registration.auth0.client-name=${AUTH0_CLIENT_NAME}
spring.security.oauth2.client.registration.auth0.authorization-grant-type=${AUTH0_GRANT_TYPE}

# 🔥 CORRECCIÓN: Agregado `authorization-grant-type`
spring.security.oauth2.client.provider.auth0.authorization-uri=${AUTH0_AUTH_URI}
spring.security.oauth2.client.provider.auth0.token-uri=${AUTH0_TOKEN_URI}
spring.security.oauth2.client.provider.auth0.user-info-uri=${AUTH0_USERINFO_URI}
spring.security.oauth2.client.provider.auth0.user-name-attribute=${AUTH0_USER_ATTRIBUTE}
